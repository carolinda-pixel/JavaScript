<DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
  </head>
  <body>
    
    <div>
      <p id="ex10">10 - Colocar os botões para funcionar</p>
      <p id="ex11">11 - Inserir um evento para quando passar o mouse por cima: inserir uma borda e cor de fundo no "Aula 3 - Javascript DOM", e quando o mouse sair de cima: voltar ao estado original.</p>
    </div>

    <script>
    //Exer. 10
    //botão 1
    document.querySelectorAll("button")[0].addEventListener("click" , function() {
      document.querySelectorAll("div")[0].style.display = "none";
    });
    //botão 2
    document.querySelectorAll("button")[1].addEventListener("click" , function() {
      document.querySelectorAll("div")[0].style.display = "block";
    });
    //Exer. 11
    const texto = document.querySelectorAll("#titulo")[0];
    texto.addEventListener("mouseover", function(){
        texto.style.border = "2px dashed red";
        texto.style.backgroundColor = "green";
    });
    texto.addEventListener("mouseout", function(){
        texto.style.border = "none";
        texto.style.backgroundColor = "white";
    });
  </script>

  </body>
  </html>
